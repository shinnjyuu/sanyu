[package]
name = "sanyu-translate"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Offline translation API for Simplified Chinese, English, and Japanese"

[dependencies]
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
fxtranslate = { version = "=0.5.0", features = ["icu-segmenter"] }
opencc-fmmseg = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
